spring.application.name=cabservice

# Activate local profile
spring.profiles.active=local

# Server
server.port=8081

# CORS: frontend origin(s)
app.cors.allowed-origins=http://localhost:5000,http://127.0.0.1:5000

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


spring.security.oauth2.resourceserver.jwt.issuer-uri=https://your-auth-server/issuer
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://your-auth-server/.well-known/jwks.json

app.jwt.secret=${JWT_SECRET:change-me-to-a-random-string-of-at-least-32-chars}
app.jwt.expiration-minutes=60

server.error.include-message=always